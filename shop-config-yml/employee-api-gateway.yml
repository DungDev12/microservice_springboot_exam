spring:
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: employee-service
              uri: lb://EMPLOYEE-SERVICE
              predicates:
                - Path=/api/employees/**
              filters:
                - JwtAuthentication
            - id: identity-employee-service
              uri: lb://IDENTITY-EMPLOYEE-SERVICE
              predicates:
                - Path=/api/auth/**,/api/roles/**,/api/permissions/**
              filters:
                - JwtAuthentication
eureka:
  instance:
    prefer-ip-address: true
#    lease-renewal-interval-in-seconds: 5
#    lease-expiration-duration-in-seconds: 10
