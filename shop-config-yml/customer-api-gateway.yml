spring:
  cloud:
    gateway:
      server:
        webflux:
          default-filters:
            - name: JwtAuthentication
          routes:
            - id: customer-service
              uri: lb://CUSTOMER-SERVICE
              predicates:
                - Path=/api/customers/**

            - id: identity-customer-service
              uri: lb://IDENTITY-CUSTOMER-SERVICE
              predicates:
                - Path=/api/auth/**,/api/accounts/**

            - id: order-service
              uri: lb://ORDER-SERVICE
              predicates:
                - Path=/api/orders/**,/api/payment/**
eureka:
  instance:
    prefer-ip-address: true
#    lease-renewal-interval-in-seconds: 5
#    lease-expiration-duration-in-seconds: 10


