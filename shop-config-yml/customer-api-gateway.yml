spring:
  cloud:
    gateway:
      server:
        webflux:
          default-filters:
            - name: JwtAuthentication
          routes:
            - id: customer-service
              uri: lb://CUSTOMER-SERVICE
              predicates:
                - Path=/api/customers/**

            - id: identity-customer-service
              uri: lb://IDENTITY-CUSTOMER-SERVICE
              predicates:
                - Path=/api/auth/**,/api/accounts/**

            - id: order-service
              uri: lb://ORDER-SERVICE
              predicates:
                - Path=/api/orders/**,/api/payment/**

vault:
  kv:
    enabled: true
    backend: ${VAULT_KV_BACKEND:shop}
    default-context: ${VAULT_KV_DEFAULT:customer}
    profile-separator: "/"

server:
  port: ${SERVER_PORT:8080}

eureka:
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 5
    lease-expiration-duration-in-seconds: 10

otp:
  # Tạo ở link https://mariushosting.com/opensslrandhex32.html
  secret: ${otp.hmac.secret}
  ttl-seconds: 300
  max-attempts: 5
