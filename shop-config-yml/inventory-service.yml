spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  grpc:
    server:
      port: 9099
      host: 0.0.0.0

server:
  port: ${SERVER_PORT:3005}

eureka:
  client:
    service-url:
      defaultZone: ${DEFAULT_ZONE_EUREKA:http://192.168.20.3:8761/eureka/}
