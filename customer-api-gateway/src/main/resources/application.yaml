spring:
  application:
    name: customer-api-gateway
  config:
    import:
      - "optional:configserver:${CONFIG_GIT_SERVER:http://192.168.20.3:8888}"
      - "vault://"
      - "optional:file:.env[.properties]"

  vault:
    uri: ${VAULT_URI:http://192.168.20.3:8200}
    token: ${VAULT_TOKEN}
    authentication: ${VAULT_CONFIG_AUTHENTICATION:TOKEN}

eureka:
  client:
    service-url:
      defaultZone: ${DEFAULT_ZONE_EUREKA}
