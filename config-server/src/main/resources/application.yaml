spring:
  application:
    name: config-server
  cloud:
    config:
      server:
        git:
          uri: ${GIT_URI}
          default-label: ${GIT_DEFAULT_LABEL}
          search-paths: ${CONFIG_SEARCH_PATHS}
server:
  port: ${SERVER_PORT:8888}

eureka:
  client:
    service-url:
      defaultZone: ${DEFAULT_ZONE_EUREKA}
