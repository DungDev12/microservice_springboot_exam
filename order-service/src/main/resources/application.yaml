spring:
  application:
    name: order-service
  config:
    import:
        - "configserver:${CONFIG_GIT_SERVER:http://192.168.20.3:8888}"
        - "optional:file:.env[.properties]"
  kafka:
    bootstrap-servers: ${KAFKA_SERVER:http://192.168.20.3:9092}

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.type.mapping: >-
          transferSuccess:com.shop.orderservice.event.TransferNotificationEvent



