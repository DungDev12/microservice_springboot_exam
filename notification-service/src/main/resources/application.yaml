spring:
  application:
    name: notification-service
  config:
    import:
      - "configserver:${CONFIG_GIT_SERVER:http://192.168.20.3:8888}"
      - "vault://"
      - "optional:file:.env[.properties]"

  cloud:
    vault:
      uri: ${VAULT_URI:http://192.168.20.3:8200}
      token: ${VAULT_TOKEN}
      authentication: ${VAULT_CONFIG_AUTHENTICATION:TOKEN}
      kv:
        enabled: true
        backend: ${VAULT_KV_BACKEND:shop}
        default-context: ${VAULT_KV_DEFAULT:notification}
        profile-separator: '/'

  mail:
    host: ${MAIL_HOST:${mail.host:smtp.gmail.com}}
    port: ${MAIL_PORT:${mail.port:587}}
    username: ${MAIL_USERNAME:${mail.username}}
    password: ${MAIL_PASSWORD:${mail.password}}
    properties:
      mail:
        smtp:
          auth: true # Bật xác thực SMTP
          starttls:
            enable: true # Bật TLS
            required: true

  kafka:
    bootstrap-servers: http://192.168.20.3:9092

    consumer:
      group-id: notification-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer

      properties:
        spring.json.trusted.packages: "com.shop.*"
        spring.json.use.type.headers: false


server:
  port: ${SERVER_PORT:8989}

eureka:
  client:
    service-url:
      defaultZone: ${DEFAULT_ZONE_EUREKA:http://192.168.20.3:8761/eureka/}