spring:
  application:
    name: employee-api-gateway
  config:
    import:
      - "configserver:${CONFIG_GIT_SERVER:http://192.168.20.3:8888}"
      - "vault://"
      - optional:file:.env[.properties]

  cloud:
    vault:
      uri: ${VAULT_URI:http://192.168.20.3:8200}
      token: ${VAULT_TOKEN}
      authentication: ${VAULT_CONFIG_AUTHENTICATION:TOKEN}
      kv:
        enabled: true
        backend: ${VAULT_KV_BACKEND:shop}
        default-context: ${VAULT_KV_DEFAULT:employee}
        profile-separator: '/'